<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" width="760" height="508" role="img" aria-labelledby="title desc" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5">
  <title id="title">Discord only sees ciphertext – encryption happens on your PCs</title>
  <desc id="desc">You type a message, Discord-PGP encrypts it on your PC, Discord stores only ciphertext, and Discord-PGP on your contact's PC decrypts and checks it. Keys are exchanged once via DM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="507" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Discord only sees ciphertext – encryption happens on your PCs</text>
  <text x="24" y="54" font-size="11.5" fill="#59636e">One message in five steps; you exchange keys once beforehand</text>

  <!-- Zones -->
  <rect x="24" y="72" width="240" height="384" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="40" y="96" font-size="13" font-weight="600" fill="#59636e">Your PC</text>
  <rect x="288" y="72" width="176" height="384" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="304" y="96" font-size="13" font-weight="600" fill="#59636e">Discord servers</text>
  <rect x="488" y="72" width="240" height="384" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="504" y="96" font-size="13" font-weight="600" fill="#59636e">Your contact's PC</text>

  <!-- Flow -->
  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M144 184V216" marker-end="url(#arrow)"/>
    <path d="M248 268H304" marker-end="url(#arrow)"/>
    <path d="M448 268H504" marker-end="url(#arrow)"/>
    <path d="M608 216V184" marker-end="url(#arrow)"/>
    <path d="M144 352V320" marker-end="url(#arrow)"/>
    <path d="M608 352V320" marker-end="url(#arrow)"/>
    <path d="M248 396H504" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="376" y="364" text-anchor="middle" font-size="11.5" fill="#59636e">key exchange</text>
  <text x="376" y="380" text-anchor="middle" font-size="11.5" fill="#59636e">once, via DM</text>

  <!-- 1. You type -->
  <rect x="40" y="112" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="144" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">1. You type</text>
  <text x="144" y="152" text-anchor="middle" fill="#1f2328">plaintext in the chat box</text>

  <!-- 2. Discord-PGP encrypts -->
  <rect x="40" y="216" width="208" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="144" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">2. Discord-PGP encrypts</text>
  <text x="144" y="256" text-anchor="middle" fill="#1f2328">signed, with metadata</text>
  <text x="144" y="272" text-anchor="middle" fill="#1f2328">to your contact and you</text>
  <text x="144" y="288" text-anchor="middle" fill="#1f2328">nothing leaves unencrypted</text>

  <!-- 3. Discord -->
  <rect x="304" y="216" width="144" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="376" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">3. Discord</text>
  <text x="376" y="256" text-anchor="middle" fill="#1f2328">stores only</text>
  <text x="376" y="272" text-anchor="middle" fill="#1f2328">ciphertext</text>
  <text x="376" y="288" text-anchor="middle" fill="#1f2328">sees: who, when,</text>
  <text x="376" y="304" text-anchor="middle" fill="#1f2328">and rough length</text>

  <!-- 4. Discord-PGP decrypts -->
  <rect x="504" y="216" width="208" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="608" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">4. Discord-PGP decrypts</text>
  <text x="608" y="256" text-anchor="middle" fill="#1f2328">checks signature, sender,</text>
  <text x="608" y="272" text-anchor="middle" fill="#1f2328">chat and time</text>
  <text x="608" y="288" text-anchor="middle" fill="#1f2328">warns on mismatches</text>

  <!-- 5. Your contact reads -->
  <rect x="504" y="112" width="208" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="608" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">5. Your contact reads</text>
  <text x="608" y="152" text-anchor="middle" fill="#1f2328">plaintext only in memory</text>
  <text x="608" y="168" text-anchor="middle" fill="#1f2328">green lock: verified</text>

  <!-- Vaults -->
  <rect x="40" y="352" width="208" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="144" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Vault</text>
  <text x="144" y="392" text-anchor="middle" fill="#1f2328">your private key,</text>
  <text x="144" y="408" text-anchor="middle" fill="#1f2328">your contacts' keys,</text>
  <text x="144" y="424" text-anchor="middle" fill="#1f2328">stored encrypted</text>

  <rect x="504" y="352" width="208" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="608" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Contact's vault</text>
  <text x="608" y="392" text-anchor="middle" fill="#1f2328">their private key,</text>
  <text x="608" y="408" text-anchor="middle" fill="#1f2328">your public key</text>

  <text x="24" y="484" font-size="11.5" fill="#59636e">Blue: where Discord-PGP works. Grey area: Discord, which only sees ciphertext and metadata.</text>
</svg>
